<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap');

  :root{
    --black:#000000; --b75:#404040; --b50:#7F7F7F; --b25:#BFBFBF;
    --green-aaa:#246342; --blue-aaa:#0C57A8; --red-aaa:#970302;
    --accent:#0C57A8;
    --accent-soft:color-mix(in srgb, var(--accent) 10%, white);
    --world:#8A8A8A;
  }
  body.palette-core{ --accent:#000000; }

  *{box-sizing:border-box;}
  body{margin:0; font-family:'Source Serif 4',serif; color:var(--black); background:#fff;}
  h1,h2,h3,.mono,.toolbar button,.year,.tick-label{font-family:'Montserrat',sans-serif;}
  a {color:var(--blue-aaa);}
  a:visited {color:var(--b50);}

  .toolbar{position:sticky; top:0; z-index:99; display:flex; justify-content:center; gap:8px; padding:12px; background:#fff; border-bottom:1px solid var(--b50);}
  .toolbar button{font-size:12.5px; font-weight:700; padding:8px 16px; border-radius:999px; border:1px solid var(--black); background:#fff; cursor:pointer;}
  .toolbar button.active{background:var(--black); color:#fff;}

  .page{max-width:960px; margin:0 auto; padding:0 24px 100px; background:#fff;}

  .masthead{display:flex; flex-direction:column; align-items:flex-start; gap:16px; padding:48px 0 6px;}
  .logos-row{display:flex; align-items:center; justify-content:space-between; width:100%; flex-wrap:wrap; gap:16px;}
  .logos-row img{height:36px; width:auto; display:block;}
  .mark{width:52px; height:52px; border-radius:50%; border:2.5px solid var(--black); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; flex:none;}
  .masthead .titles h1{font-size:clamp(30px,5vw,42px); font-weight:800; margin:0; line-height:1.05;}
  .masthead .titles .kicker{font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.03em; margin-bottom:2px;}
  .masthead .titles .sub{font-size:14.5px; color:var(--b50); margin-top:6px; font-style:italic;}

  .legend{display:flex; gap:22px; justify-content:center; margin:22px 0 6px; font-size:12.5px; font-weight:600; color:var(--b75);}
  .legend span{display:flex; align-items:center; gap:7px;}
  .legend i{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .legend .li-world i{background:var(--world);}
  .legend .li-wiki i{background:var(--accent);}

  #main{position:relative; margin-top:20px;}
  .spine{position:absolute; left:50%; top:0; width:2px; background:var(--b25); transform:translateX(-1px);}
  .tick{position:absolute; left:50%; width:6px; height:6px; border-radius:50%; background:var(--b25); transform:translate(-50%,-50%); z-index:1;}
  .tick-label{position:absolute; left:50%; transform:translate(-50%,-50%); font-size:10px; font-weight:700; color:var(--b50); background:#fff; padding:0 4px; z-index:1;}

  .node{position:absolute; left:50%; width:14px; height:14px; border-radius:50%; transform:translate(-50%,-50%); border:3px solid #fff; z-index:3;}
  .node.n-world{background:var(--world); box-shadow:0 0 0 1.5px var(--world); width:10px; height:10px;}
  .node.n-wiki{background:var(--accent); box-shadow:0 0 0 1.5px var(--accent);}
  .node.n-frame{background:var(--accent); box-shadow:0 0 0 1.5px var(--accent); border-radius:3px; transform:translate(-50%,-50%) rotate(45deg);}

  .entry{position:absolute; width:calc(50% - 50px);}
  .entry.world{right:calc(50% + 30px); text-align:right;}
  .entry.wiki{left:calc(50% + 30px); text-align:left;}

  .entry.world .date{font-size:13px; font-weight:700; color:var(--world);}
  .entry.world h3{font-size:13px; font-weight:600; margin:2px 0 0; color:var(--b50); font-style:italic;}
  .entry.world a{color:var(--b50); text-decoration: none;}
  .entry.world a:hover{text-decoration: underline;}
  .entry.world a:visited{color:var(--b50);}

  .entry.wiki .date{font-size:13px; font-weight:700; color:var(--accent);}
  .entry.wiki h3{font-size:15px; font-weight:700; margin:2px 0 3px;}
  .entry.wiki p.desc{font-size:13px; line-height:1.5; margin:0; color:var(--b75);}
  .entry.wiki .chart-item{margin-top:12px;}
  .entry.wiki .chart-title{font-size:11px; font-weight:500; color:var(--b50); margin:0 0 4px;}
  .chart-legend{display:flex; flex-wrap:wrap; gap:3px 14px; margin:0 0 6px; font-family:'Source Serif 4',sans-serif; font-size:11px; font-weight:500; color:var(--b50);}
  .chart-legend span{display:flex; align-items:center; gap:6px;}
  .chart-legend i{width:20px; height:3px; border-radius:2px; display:inline-block;}

  /* full-width breakout panel — for content that needs more room than one column */
  .entry.panel{position:absolute; left:0; right:0; width:100%; margin:0 -24px; padding:0 24px; z-index:5;}  /* z-index wyżej niż kropki lat (1) i znaczniki (3): panel zasłania oś */
  .entry.panel .card{border:1px solid var(--b25); background: #ffffff;  padding:16px 30px; width:100%;}
  .entry.panel .box{border:1px solid var(--b25); background: var(--accent-soft);  padding:16px 30px; width:100%;}
  .entry.panel .panel-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:6px;}
  .entry.panel .tag{font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.03em;}
  .entry.panel h3{font-size:18px; font-weight:700; margin:2px 0 0;}
  .entry.panel .date{font-size:12px; font-weight:700; color:var(--b50);}
  .entry.panel .panel-grid{display:grid; grid-template-columns:1fr 1fr; gap:38px; align-items:start;}
  .entry.panel .chart-box .label{font-size:12px; font-weight:700; color:var(--b75); margin-bottom:8px;}

  /* chart card internals */
  .chartsvg{width:100%; height:auto; display:block; overflow:visible;}
  .axis-lbl{font-size:8px; fill:var(--b50); font-family:'Montserrat',sans-serif;}
  .datapoint{cursor:pointer;}
  .bar-rect{cursor:pointer; transition:opacity .15s;}
  .bar-rect:hover{opacity:.7;}
  .tooltip{position:absolute; pointer-events:none; background:var(--black); color:#fff; font-size:11px; font-weight:600; padding:4px 8px; border-radius:4px; transform:translate(-50%,-130%); white-space:nowrap; opacity:0; transition:opacity .1s; z-index:10; font-family:'Montserrat',sans-serif;}
  .tooltip.show{opacity:1;}

  .taglist{list-style:none; margin:0; padding:0;}
  .taglist li{font-size:13.5px; line-height:1.6; padding:4px 0 4px 16px; position:relative; color:var(--b75);}
  .taglist li::before{content:'—'; position:absolute; left:0; color:var(--accent);}

  footer{text-align:center; padding:60px 0 20px; color:var(--b50); font-size:12.5px;}
  footer .flogos{display:flex; justify-content:center; align-items:center; gap:22px; margin-bottom:14px;}

  @media (max-width:760px){
    #main{margin-left:8px;}
    .spine, .tick, .tick-label, .node{left:20px;}
    .entry.world, .entry.wiki{left:44px; right:auto; width:calc(100% - 60px); text-align:left;}
    .entry.world{text-align:left;}
    .tick-label{display:none;}
    .entry.panel .panel-grid{grid-template-columns:1fr; gap:20px;}
    .entry.panel .card{padding:18px 16px;}
    .entry.panel .box{padding:18px 16px;}
  }
</style>
</head>

// 2) POZYCJONOWANIE NA OSI CZASU
//    (matematyka: rok -> piksele; algorytm "rozpychania" kolizji)
// ============================================================
function yPos(year){ return TOP_PAD + (year - START_YEAR) * PXY; }

// Panel pełnoszerokościowy LEŻY NA osi czasu, nie rozpycha jej: czas płynie dalej
// "pod" panelem, a kropki lat i linia osi, które wypadają za nim, są przez niego
// zasłonięte (z-index). Dlatego nie ma tu przesunięcia PO panelu.
// Jedyny powód przesunięcia to sytuacja odwrotna:
//  - frontDelta — coś PRZED panelem (także z tym samym rokiem — częsty przypadek
//                 przy literówce w dacie) jest na tyle wysokie, że wjeżdża na początek
//                 panelu; wtedy trzeba odsunąć sam panel (i wszystko po nim) dalej.

// Faza 1: POLICZ, o ile trzeba odsunąć panel. Czyta wysokości z DOM-u
// (wszystko musi być już wyrenderowane), ale niczego jeszcze nie zapisuje.
function computePushDownDeltas(eventRefs){
  const GAP = 30;
  return eventRefs
    .filter(r => r.e.kind === 'panel-full')
    .sort((a,b) => a.e.year - b.e.year)
    .map(p => {
      const panelTop = parseFloat(p.div.style.top);

      let frontDelta = 0;
      eventRefs.forEach(r => {
        if(r === p || r.e.kind === 'panel-full' || r.e.year > p.e.year) return;
        const otherBottom = parseFloat(r.div.style.top) + r.div.getBoundingClientRect().height;
        frontDelta = Math.max(frontDelta, otherBottom + GAP - panelTop);
      });

      return {panelRef: p, thresholdYear: p.e.year, frontDelta: Math.max(0, frontDelta)};
    })
    .filter(d => d.frontDelta > 0);
}

// Faza 2: ZASTOSUJ policzone przesunięcia — jedno przejście po tickach
// i wpisach. Coś z rokiem >= progu (w tym sam panel) dostaje frontDelta.
function applyPushDownDeltas(deltas, {tickRefs, eventRefs, main, spine, totalHeight}){
  if(deltas.length === 0) return;

  const shiftFor = (year) => deltas.reduce((sum,d) => year >= d.thresholdYear ? sum + d.frontDelta : sum, 0);

  tickRefs.forEach(t => {
    const shift = shiftFor(t.year);
    if(shift > 0) t.el.style.top = (parseFloat(t.el.style.top) + shift) + 'px';
  });
  eventRefs.forEach(r => {
    const shift = shiftFor(r.e.year);
    if(shift > 0){
      r.div.style.top = (parseFloat(r.div.style.top) + shift) + 'px';
      r.node.style.top = (parseFloat(r.node.style.top) + shift) + 'px';
    }
  });

  const cumulativeDelta = deltas.reduce((sum,d) => sum + d.frontDelta, 0);
  const newHeight = totalHeight + cumulativeDelta;
  main.style.height = newHeight + 'px';
  spine.style.height = newHeight + 'px';
}

// 4) WYKRESY SVG
//    (wspólne helpery do skalowania/osi + jedna funkcja budująca na wykres)
// ============================================================

// serie "liniowe": równe odstępy w X, wysokość proporcjonalna do wartości
function scaleLine(values, {w, h, padL, padR, padT, padB, maxV}){
  const stepX = (w - padL - padR) / (values.length - 1);
  return values.map((v, i) => ({
    x: padL + i * stepX,
    y: padT + (h - padT - padB) * (1 - v / maxV),
    val: v,
    index: i,
  }));
}

// same pozycje X / szerokości słupków, równomiernie rozłożonych na osi X
function scaleCategoryX(n, {w, padL, padR, gap}){
  const bw = (w - padL - padR - gap * (n - 1)) / n;
  return Array.from({length: n}, (_, i) => ({x: padL + i * (bw + gap), bw}));
}

// pełne słupki (X + wysokość) dla prostego wykresu słupkowego jednej serii
function scaleBars(values, {w, h, padL, padR, padT, padB, gap, maxV}){
  return scaleCategoryX(values.length, {w, padL, padR, gap}).map((pos, i) => {
    const bh = (h - padT - padB) * (values[i] / maxV);
    return {x: pos.x, y: h - padB - bh, bw: pos.bw, bh, val: values[i], index: i};
  });
}

function axisLabelSvg(x, y, text){
  return `<text class="axis-lbl" x="${x}" y="${y}" text-anchor="middle">${text}</text>`;
}
// pokazuje na osi tylko rok z etykiety w formacie 'RRRR-MM' (np. '2001-09' -> '2001')
function yearOnly(monthStr){
  return String(monthStr).slice(0, 4);
}

// wybiera indeksy do podpisania na osi tak, żeby zawsze trafiać w styczeń kolejnych, RÓWNO ROZŁOŻONYCH LAT
function yearAxisIdx(labels, maxTicks = 5){
  const years = labels.map(l => parseInt(String(l).slice(0, 4), 10));
  let startYear = years[0];
  if (labels.indexOf(`${startYear}-01`) === -1) startYear += 1;
  const lastYear = years[years.length - 1];
  const span = lastYear - startYear;
  const step = Math.max(1, Math.round(span / Math.max(1, maxTicks - 1)));
  const idxs = [];
  for (let y = startYear; y <= lastYear; y += step) {
    const idx = labels.indexOf(`${y}-01`);
    if (idx !== -1) idxs.push(idx);
  }
  return idxs;
}

function buildEntryGrowthChart(){
  const w=300, h=120, padL=8, padR=8, padT=30, padB=16;
  const pts = scaleLine(entryGrowthVals, {w, h, padL, padR, padT, padB, maxV: entryGrowthMaxScale})
    .map(p => ({...p, month: entryGrowthMonths[p.index]}));
  const poly = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area = `${pts[0].x.toFixed(1)},${h-padB} ${poly} ${pts[pts.length-1].x.toFixed(1)},${h-padB}`;
  // tooltip nad całą osią: każdy miesiąc dostaje niewidoczny pionowy pasek (paski przylegają do siebie).
  // Paski są rysowane PRZED dopiskami, więc kropki kamieni milowych zostają na wierzchu i mają własne tooltipy.
  const stepX = pts[1].x - pts[0].x;
  const dots = pts.map(p =>
    `<rect class="datapoint" x="${(p.x - stepX/2).toFixed(2)}" y="${padT}" width="${stepX.toFixed(2)}" height="${(h - padB - padT).toFixed(1)}" fill="transparent" style="cursor:default" data-label="${p.month}, liczba artykułów: ${p.val.toLocaleString('pl-PL')}"/>`).join('');
  const axis = entryGrowthAxisIdx.map(i => axisLabelSvg(pts[i].x.toFixed(1), h-4, yearOnly(pts[i].month))).join('');

  function callout(idx, value, dateLine, valLine, anchor){
    const p = pts[idx];
    const cy = padT + (h - padT - padB) * (1 - value/entryGrowthMaxScale);
    const topY = 24;
    const lx = anchor==='start' ? p.x+3 : anchor==='end' ? p.x-3 : p.x;
    return `<line x1="${p.x.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${p.x.toFixed(1)}" y2="${topY}" stroke="var(--b50)" stroke-width="1" stroke-dasharray="3,3"/>
      <circle class="datapoint" cx="${p.x.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="var(--accent)" stroke="#fff" stroke-width="1.2" data-label="${dateLine}: ${valLine}"/>
      <text x="${lx.toFixed(1)}" y="6" text-anchor="${anchor}" style="font-size:7px;font-weight:700;fill:var(--b75);font-family:'Montserrat',sans-serif;">${dateLine}</text>

  }

  const callouts = entryGrowthCallouts.map(c => callout(c.idx, c.value, c.dateLine, c.valLine, c.anchor)).join('');

  return `<svg class="chartsvg" viewBox="0 0 ${w} ${h}">
    <polygon points="${area}" fill="var(--accent)" opacity=".12"/>
    <polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${dots}${axis}${callouts}
  </svg>`;
}

// ---- FUNKCJE POMOCNICZE ----

// jak scaleLine, ale toleruje null — wtedy y:null (punkt bez danych, linia się w tym miejscu przerywa)
function scaleSeriesWithGaps(values, {w, h, padL, padR, padT, padB, maxV}){
  const stepX = (w - padL - padR) / (values.length - 1);
  return values.map((v, i) => ({
    x: padL + i * stepX,
    y: v == null ? null : padT + (h - padT - padB) * (1 - v / maxV),
    val: v,
    index: i,
  }));
}

// rysuje jedną serię jako kilka osobnych <polyline> — nowy odcinek zaczyna się
// za każdą "dziurą" (null), więc na wykresie widać realną przerwę, a nie linię przez zero
function polylineSegments(points, strokeColor, width){
  let segments = '', current = [];
  const flush = () => {
    if(current.length > 1){
      segments += `<polyline points="${current.map(q => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' ')}" fill="none" stroke="${strokeColor}" stroke-width="${width}"/>`;
    }
    current = [];
  };
  points.forEach(p => p.y == null ? flush() : current.push(p));
  flush();
  return segments;
}

// podpisy wartości przy wybranych latach (indeksy w viewsYearlyLabels): 2021 i 2025.
// Pierwszy indeks to punkt odniesienia — przy ostatnim dopisujemy zmianę procentową względem niego.
const viewsLabelIdx = [5, 9];

function formatViews(v){   // wartości są w mln: 3081.4 → "3,1 mld", 727.1 → "727 mln"
  return v >= 1000
    ? (v / 1000).toLocaleString('pl-PL', {maximumFractionDigits: 1}) + ' mld'
    : Math.round(v).toLocaleString('pl-PL') + ' mln';
}

function buildViewsHumanVsBotChart(){
  const w=280, h=108, padL=8, padR=8, padT=18, padB=16;   // padT 18: miejsce na podpisy nad punktami
  const maxV = Math.max(...[...viewsHumanVals, ...viewsBotVals].filter(v => v != null));

  const humanPts = scaleSeriesWithGaps(viewsHumanVals, {w, h, padL, padR, padT, padB, maxV});
  const botPts   = scaleSeriesWithGaps(viewsBotVals,   {w, h, padL, padR, padT, padB, maxV});

  const humanLine = polylineSegments(humanPts, 'var(--accent)', 2);
  const botLine    = polylineSegments(botPts, 'var(--red-aaa)', 2);

  const humanDots = humanPts.filter(p => p.y != null).map(p =>
    `<circle class="datapoint" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="var(--accent)" data-label="${viewsYearlyLabels[p.index]}, użytkownicy: ${p.val.toLocaleString('PL-pl')} mln"/>`).join('');
  const botDots = botPts.filter(p => p.y != null).map(p =>
    `<circle class="datapoint" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="var(--red-aaa)" data-label="${viewsYearlyLabels[p.index]}, boty: ${p.val.toLocaleString('PL-pl')} mln"/>`).join('');

  // podpisy wartości nad wybranymi punktami; przy ostatnim — dopisek ze zmianą procentową względem roku odniesienia
  const refIdx = viewsLabelIdx[0], lastIdx = viewsLabelIdx[viewsLabelIdx.length - 1];
  function valueLabels(pts, color){
    return viewsLabelIdx.map(i => {
      const p = pts[i];
      if(p.y == null || p.val == null) return '';
      const isLast = i === lastIdx && i !== refIdx;
      let text = formatViews(p.val);
      if(isLast && pts[refIdx].val != null){
        const pct = Math.round((p.val / pts[refIdx].val - 1) * 100);
        text += ` (${pct > 0 ? '+' : '−'}${Math.abs(pct)}%)`;
      }
      const x = isLast ? p.x + 4 : p.x;
      return `<text x="${x.toFixed(1)}" y="${(p.y - 7).toFixed(1)}" text-anchor="${isLast ? 'end' : 'middle'}" style="pointer-events:none;font-size:7px;font-weight:700;fill:${color};font-family:'Montserrat',sans-serif;">${text}</text>`;
    }).join('');
  }
  const labels = valueLabels(humanPts, 'var(--accent)') + valueLabels(botPts, 'var(--red-aaa)');

  const axis = humanPts.map((p,i) => axisLabelSvg(p.x.toFixed(1), h-4, viewsYearlyLabels[i])).join('');

  return `<svg class="chartsvg" viewBox="0 0 ${w} ${h}">
    ${humanLine}${botLine}${humanDots}${botDots}${labels}${axis}
  </svg>`;
}

  const pts = scaleLine(activeEditorsRealVals, {w, h, padL, padR, padT, padB, maxV})

  const poly = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area = `${pts[0].x.toFixed(1)},${h-padB} ${poly} ${pts[pts.length-1].x.toFixed(1)},${h-padB}`;

  // granice faz: szczyt (2007-2011, wysoki plateau) / spadek (2011-2013) / stabilizacja (2013-dziś)
  const peakStart = 64;     // 2007-01
  const declineStart = 112; // 2011-01
  const declineEnd = 136;   // 2013-01
  const zoneTop = padT - 4, zoneBottom = h - padB;

  const declineBg = `<rect x="${pts[declineStart].x.toFixed(1)}" y="${zoneTop}" width="${(pts[declineEnd].x-pts[declineStart].x).toFixed(1)}" height="${(zoneBottom-zoneTop).toFixed(1)}" fill="var(--red-aaa)" opacity=".07"/>`;
  const peakBg = `<rect x="${pts[peakStart].x.toFixed(1)}" y="${zoneTop}" width="${(pts[declineStart].x-pts[peakStart].x).toFixed(1)}" height="${(zoneBottom-zoneTop).toFixed(1)}" fill="var(--accent)" opacity=".06"/>`;
  const dividers = [peakStart, declineStart, declineEnd].map(i =>
    `<line x1="${pts[i].x.toFixed(1)}" y1="${zoneTop}" x2="${pts[i].x.toFixed(1)}" y2="${zoneBottom}" stroke="var(--b50)" stroke-width="1" stroke-dasharray="2,2"/>`
  ).join('');

  // nagłówki trzech faz: rozstawione RÓWNOMIERNIE (żeby nigdy się nie zderzały, niezależnie od tego,
  // jak wąska jest dana strefa), każdy połączony przerywaną linią-wskaźnikiem z rzeczywistym środkiem swojej strefy.
  function phaseHeader(labelX, zoneCenterX, dateRange,  color){
    const leader = Math.abs(labelX-zoneCenterX) > 2
      ? `<line x1="${labelX.toFixed(1)}" y1="26" x2="${zoneCenterX.toFixed(1)}" y2="${zoneTop}" stroke="${color}" stroke-width="1" stroke-dasharray="1.5,1.5" opacity=".5"/>`

`;
  }
  const labelSpanL = pts[0].x, labelSpanR = pts[pts.length-1].x, labelSpanW = labelSpanR - labelSpanL;
  const zoneLabels = phaseHeader(labelSpanL + labelSpanW*(3/12), pts[Math.round((peakStart+declineStart)/2)].x, 'Szczyt',  'var(--accent)')
    + phaseHeader(labelSpanL + labelSpanW*(5/12), pts[Math.round((declineStart+declineEnd)/2)].x, 'Spadek',  'var(--red-aaa)')
    + phaseHeader(labelSpanL + labelSpanW*(9/12), pts[Math.round((declineEnd+pts.length-1)/2)].x, 'Stabilizacja',  'var(--b75)');

  // tooltip: przy ~300 punktach na wąskim wykresie trafienie w sam punkt jest prawie niemożliwe

  const stepX = pts[1].x - pts[0].x;
  const dots = pts.map(p =>

function roundMln(n) {
  return Math.round(n/1e6);
}

function buildDesktopMobileChart(){
  const w=280, h=130, padL=6, padR=6, padT=34, padB=16;   // padT 34: miejsce na dopisek nad wykresem (do 3 linii)
  const maxV = Math.max(...desktopMobileDesktopVals, ...desktopMobileMobileVals);

  const desktopPts = scaleLine(desktopMobileDesktopVals, {w, h, padL, padR, padT, padB, maxV});
  const mobilePts  = scaleLine(desktopMobileMobileVals,  {w, h, padL, padR, padT, padB, maxV});

  const desktopPoly = desktopPts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const mobilePoly  = mobilePts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  // małe, widoczne punkty (żeby było widać, że można na nie najechać) + etykieta w tooltipie po najechaniu
  const desktopDots = desktopPts.map(p =>
    `<circle class="datapoint" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="1.1" fill="var(--accent)" data-label="Ruch z komputerów, ${desktopMobileLabels[p.index]}: ${roundMln(p.val)} mln"/>`).join('');
  const mobileDots = mobilePts.map(p =>
    `<circle class="datapoint" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="1.1" fill="var(--red-aaa)" data-label="Ruch z telefonów, ${desktopMobileLabels[p.index]}: ${roundMln(p.val)} mln"/>`).join('');

  const axis = desktopMobileAxisIdx.map(i => axisLabelSvg(desktopPts[i].x.toFixed(1), h-4, yearOnly(desktopMobileLabels[i]))).join('');

  // --- dopisek na przecięciu linii ---
  // ci = pierwszy miesiąc, w którym telefony są wyżej niż komputery; przecięcie leży między ci-1 a ci
  // (interpolacja liniowa, więc kropka trafia dokładnie w miejsce, gdzie linie się krzyżują)
  const ci = desktopMobileMobileVals.findIndex((m, i) => m > desktopMobileDesktopVals[i]);
  let annotation = '';
  if (ci > 0) {
    const d0 = desktopMobileDesktopVals[ci-1] - desktopMobileMobileVals[ci-1];
    const d1 = desktopMobileDesktopVals[ci]   - desktopMobileMobileVals[ci];
    const k  = d0 / (d0 - d1);
    const cx = desktopPts[ci-1].x + k * (desktopPts[ci].x - desktopPts[ci-1].x);
    const cy = desktopPts[ci-1].y + k * (desktopPts[ci].y - desktopPts[ci-1].y);

    const a = desktopMobileAnnotation;
    const lx = a.anchor === 'start' ? cx + 4 : a.anchor === 'end' ? cx - 4 : cx;
    const firstY = 20, lineStep = 9;
    const leaderTopY = firstY + (a.lines.length - 1) * lineStep + 5;
    const texts = a.lines.map((line, n) =>
      `<text x="${lx.toFixed(1)}" y="${firstY + n * lineStep}" text-anchor="${a.anchor}" style="font-size:7px;font-weight:${n === 0 ? 700 : 500};fill:var(--b75);font-family:'Montserrat',sans-serif;">${line}</text>`).join('');

    annotation = `<g style="pointer-events:none;">
      <line x1="${cx.toFixed(1)}" y1="${leaderTopY}" x2="${cx.toFixed(1)}" y2="${cy.toFixed(1)}" stroke="var(--b50)" stroke-width="1" stroke-dasharray="3,3"/>
      ${texts}
      <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3" fill="#fff" stroke="var(--b75)" stroke-width="1.2"/>
    </g>`;
  }

  return `<svg class="chartsvg" viewBox="0 0 ${w} ${h}">
    <polyline points="${desktopPoly}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
    <polyline points="${mobilePoly}" fill="none" stroke="var(--red-aaa)" stroke-width="1.5"/>
    ${desktopDots}${mobileDots}${annotation}${axis}
  </svg>`;
}

  const maxV = Math.max(...totalArticlesVals);
  const pts = scaleLine(totalArticlesVals, {w, h, padL, padR, padT, padB, maxV})
    .map(p => ({...p, month: totalArticlesLabels[p.index]}));

  const poly = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area = `${pts[0].x.toFixed(1)},${h-padB} ${poly} ${pts[pts.length-1].x.toFixed(1)},${h-padB}`;

  // tooltip nad całą osią: każdy miesiąc dostaje niewidoczny pionowy pasek (paski przylegają do siebie).
  // Paski są rysowane PRZED kamieniami milowymi, żeby nie zasłaniały ich podpisów i linków do artykułów.
  const stepX = pts[1].x - pts[0].x;
  const dots = pts.map(p =>
    `<rect class="datapoint" x="${(p.x - stepX/2).toFixed(2)}" y="${padT}" width="${stepX.toFixed(2)}" height="${(h - padB - padT).toFixed(1)}" fill="transparent" style="cursor:default" data-label="${p.month}, liczba artykułów: ${p.val.toLocaleString('pl-PL')}"/>`).join('');

  const axis = totalArticlesAxisIdx.map(i =>
    `<text x="${pts[i].x.toFixed(1)}" y="${h-10}" text-anchor="middle" style="font-size:13px;fill:var(--b50);font-family:'Montserrat',sans-serif;">${yearOnly(pts[i].month)}</text>`
  ).join('');

  // 5 poziomów wysokości: level 0 (najniżej, najbliżej krzywej) do level 4 (najwyżej).
  const levelY = [180, 145, 110, 60, 14];
  const milestoneEls = totalArticlesMilestones.map((m) => {
    const dotX = pts[m.idx].x;
    const dotY = padT + (h - padT - padB) * (1 - m.value/maxV);
    const y0 = levelY[m.level];
    const leaderEndY = y0 + (m.articleTitle ? 30 : 17);
    const leader = `<line x1="${dotX.toFixed(1)}" y1="${leaderEndY.toFixed(1)}" x2="${dotX.toFixed(1)}" y2="${dotY.toFixed(1)}" stroke="var(--b50)" stroke-width="1.2" stroke-dasharray="3,3" opacity=".55"/>`;
    const dot = `<circle cx="${dotX.toFixed(1)}" cy="${dotY.toFixed(1)}" r="3.5" fill="var(--accent)" stroke="#fff" stroke-width="1.5"/>`;
    const l1 = `<text x="${dotX.toFixed(1)}" y="${y0.toFixed(1)}" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--b75);font-family:'Montserrat',sans-serif;">${m.dateLine}</text>`;
    const l2b = `<text x="${dotX.toFixed(1)}" y="${(y0+14).toFixed(1)}" text-anchor="middle" style="font-size:11px;font-weight:600;fill:var(--accent);font-family:'Montserrat',sans-serif;">${m.valueLine}</text>`;
    const l2 = m.articleTitle
      ? `${l2b}<text x="${dotX.toFixed(1)}" y="${(y0+28).toFixed(1)}" text-anchor="middle" style="font-size:11px;font-weight:600;font-family:'Montserrat',sans-serif;"><a href="${m.articleUrl}" target="_blank" rel="noopener"><tspan fill="var(--accent)" style="text-decoration:underline;cursor:pointer;">${m.articleTitle}</tspan></a></text>`
      : l2b;
    return leader + l1 + l2 + dot;
  }).join('');

  return `<svg class="chartsvg" viewBox="0 0 ${w} ${h}">
    <polygon points="${area}" fill="var(--accent)" opacity=".12"/>
    <polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="3"/>
    ${dots}
    ${milestoneEls}
    ${axis}
  </svg>`;
}

(async function buildTimeline(){

]);

const main = document.getElementById('main');
// Budowa i układ osi siedzą w jednej funkcji, żeby dało się je powtórzyć po zmianie szerokości okna
// (wysokość wpisów zależy od szerokości, a rozpychanie liczone jest na zmierzonych wysokościach).
function layoutTimeline(){
main.innerHTML = '';   // czyści oś, znaczniki i wpisy z poprzedniego przebiegu
const totalHeight = yPos(END_YEAR) + 40;
main.style.height = totalHeight + 'px';

const spine = document.createElement('div');

spine.style.height = totalHeight + 'px';
main.appendChild(spine);

// znaczniki lat (kropka na każdy rok; podpis co 5 lat)
const tickRefs = [];
for(let y = START_YEAR; y <= END_YEAR - 1; y++){
  const t = document.createElement('div');
  t.className = 'tick';
  t.style.top = yPos(y) + 'px';
  main.appendChild(t);
  tickRefs.push({el:t, year:y});
  if(y % 5 === 0){
    const l = document.createElement('div');
    l.className = 'tick-label';
    l.style.top = yPos(y) + 'px';
    l.textContent = y;
    main.appendChild(l);
    tickRefs.push({el:l, year:y});
  }
}

// wpisy: dla każdego eventu — znacznik na osi + karta z treścią
const eventRefs = [];
events.forEach(e => {
  const top = yPos(e.year);

  const node = document.createElement('div');
  node.className = nodeClassFor(e);
  node.style.top = top + 'px';
  main.appendChild(node);

  const content = renderEntryContent(e);
  const div = document.createElement('div');
  div.className = content.className;
  div.innerHTML = content.html;
  div.style.top = (top - 10) + 'px';
  main.appendChild(div);

  eventRefs.push({e, div, node});
});

// rozepchnij w dół wszystko, co jest po pełnoszerokościowym panelu,
// żeby nic się nie nakładało (zamiast zasłaniać treść, otwieramy realną pustą przestrzeń na osi)
applyPushDownDeltas(computePushDownDeltas(eventRefs), {tickRefs, eventRefs, main, spine, totalHeight});

// Rozpycha wpisy tak, żeby się nie nakładały — i to SKOORDYNOWANE między stronami i osią.
// - Lokalnie: 'world' i 'wiki' rozpychane są OSOBNO (kolizja po lewej nie zależy od tego,
//   co jest po prawej — i odwrotnie).
// - Globalnie: skutek takiego rozpychania (ile miejsca przybyło i OD KTÓREGO ROKU) jest
//   współdzielony — wszystko z rokiem PÓŹNIEJSZYM niż przyczyna (niezależnie po której
//   jest stronie) i cała oś (ticki) zjeżdżają o tyle samo w dół.
// - singleColumn:true (mobile) — obie strony to jedna wspólna kolumna od razu w fazie 1,
//   więc faza 2 (synchronizacja) się nie stosuje, bo nie ma już czego synchronizować.
function resolveOverlaps(eventRefs, {tickRefs, main, spine, singleColumn}){
  const GAP = 16;
  const allCorrections = []; // {year, extra, side} — year to ROK PRZYCZYNY (za wysokiego wpisu), nie "ofiary"

  const groups = singleColumn
    ? [{side: null, refs: eventRefs}]
    : [
        {side: 'world', refs: eventRefs.filter(r => r.e.side === 'world')},
        {side: 'wiki',  refs: eventRefs.filter(r => r.e.side === 'wiki')},
      ];

  // FAZA 1: lokalne rozpychanie w obrębie każdej strony osobno
  groups.forEach(({side, refs}) => {
    const sorted = [...refs].sort((a, b) => a.e.year - b.e.year);
    let cumulativeDelta = 0, prevBottom = null, prevYear = null;
    sorted.forEach(r => {
      if(cumulativeDelta > 0){
        r.div.style.top = (parseFloat(r.div.style.top) + cumulativeDelta) + 'px';
        r.node.style.top = (parseFloat(r.node.style.top) + cumulativeDelta) + 'px';
      }
      const top = parseFloat(r.div.style.top);
      const height = r.div.getBoundingClientRect().height;
      if(prevBottom != null && top < prevBottom + GAP){
        const extra = (prevBottom + GAP) - top;
        r.div.style.top = (top + extra) + 'px';
        r.node.style.top = (parseFloat(r.node.style.top) + extra) + 'px';
        cumulativeDelta += extra;
        allCorrections.push({year: prevYear, extra, side});
      }
      prevBottom = parseFloat(r.div.style.top) + height;
      prevYear = r.e.year;
    });
  });

  // FAZA 2: synchronizacja między stronami (tylko desktop)
  if(!singleColumn){
    groups.forEach(({side, refs}) => {
      const otherSideCorrections = allCorrections.filter(c => c.side !== side);
      if(otherSideCorrections.length === 0) return;
      refs.forEach(r => {
        const shift = otherSideCorrections.reduce((sum, c) => r.e.year > c.year ? sum + c.extra : sum, 0);
        if(shift > 0){
          r.div.style.top = (parseFloat(r.div.style.top) + shift) + 'px';
          r.node.style.top = (parseFloat(r.node.style.top) + shift) + 'px';
        }
      });
    });
  }

  // Oś (ticki) zawsze dostaje sumę WSZYSTKICH korekt (z obu stron) sprzed jej roku
  if(allCorrections.length > 0){
    tickRefs.forEach(t => {
      const shift = allCorrections.reduce((sum, c) => t.year > c.year ? sum + c.extra : sum, 0);
      if(shift > 0) t.el.style.top = (parseFloat(t.el.style.top) + shift) + 'px';
    });
    const totalExtra = allCorrections.reduce((s, c) => s + c.extra, 0);
    const newHeight = parseFloat(main.style.height) + totalExtra;
    main.style.height = newHeight + 'px';
    spine.style.height = newHeight + 'px';
  }
}

resolveOverlaps(eventRefs, {
  tickRefs, main, spine,
  singleColumn: window.matchMedia('(max-width:760px)').matches,
});

// panel leży na osi i zasłania wszystko, co jest pod nim — ostrzeż, jeśli jakiś wpis tam trafił
eventRefs.filter(r => r.e.kind === 'panel-full').forEach(p => {
  const pTop = parseFloat(p.div.style.top), pBottom = pTop + p.div.getBoundingClientRect().height;
  eventRefs.forEach(r => {
    if(r === p) return;
    const top = parseFloat(r.div.style.top), bottom = top + r.div.getBoundingClientRect().height;
    if(top < pBottom && bottom > pTop){
      console.warn('Wpis zasłonięty przez panel pełnoszerokościowy:', r.e.year, r.e.title || r.e.date);
    }
  });
});

// stopka musi zaczynać się pod ostatnim wpisem, niezależnie od jego wysokości
// (#main ma wysokość liczoną z lat, a wpisy są position:absolute, więc same go nie rozpychają)
{
  const lowestBottom = Math.max(...eventRefs.map(r => parseFloat(r.div.style.top) + r.div.getBoundingClientRect().height));
  if(lowestBottom > parseFloat(main.style.height))  main.style.height  = lowestBottom + 'px';
  if(lowestBottom > parseFloat(spine.style.height)) spine.style.height = lowestBottom + 'px';
}
}   // koniec layoutTimeline

layoutTimeline();

// przelicz układ po zmianie SZEROKOŚCI okna (z krótką zwłoką, żeby nie liczyć przy każdym pikselu);
// zmiana samej wysokości (np. pasek adresu na telefonie) nie wpływa na układ, więc jest pomijana
let resizeTimer = null, lastWidth = window.innerWidth;
window.addEventListener('resize', () => {
  if(window.innerWidth === lastWidth) return;
  lastWidth = window.innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(layoutTimeline, 150);
});

// tooltip dla wykresów
const tooltip = document.createElement('div');
tooltip.className = 'tooltip';
document.body.appendChild(tooltip);
main.addEventListener('mouseover', (ev)=>{
  const target = ev.target.closest('.datapoint, .bar-rect');
  if(!target) return;
  tooltip.textContent = target.dataset.label;
  tooltip.classList.add('show');
});
main.addEventListener('mousemove', (ev)=>{
  if(tooltip.classList.contains('show')){
    tooltip.style.left = ev.pageX + 'px';
    tooltip.style.top = ev.pageY + 'px';
  }
});
main.addEventListener('mouseout', (ev)=>{
  if(ev.target.closest('.datapoint, .bar-rect')) tooltip.classList.remove('show');
});

// przełącznik palety kolorów
document.querySelectorAll('.toolbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.body.classList.toggle('palette-core', btn.dataset.p==='core');
    document.body.classList.toggle('palette-legacy', btn.dataset.p==='legacy');
  });
});
})();
</script>
</body>
</html>
